<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机预览 · 工作台</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px 132px;
        background:
          radial-gradient(circle at 50% 0%, #23221d 0%, #14130f 55%, #0d0c0a 100%);
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      .device {
        position: relative;
        padding: 11px;
        border-radius: 56px;
        background: linear-gradient(155deg, #3a3832 0%, #0c0b09 38%, #1b1a15 100%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.09),
          0 50px 90px -24px rgba(0, 0, 0, 0.85),
          0 0 0 1px rgba(0, 0, 0, 0.6);
        transform-origin: center center;
        transition: transform 0.22s ease;
      }

      .device iframe {
        display: block;
        border: 0;
        border-radius: 46px;
        background: #f7f5f1;
        transition:
          width 0.22s ease,
          height 0.22s ease;
      }

      .notch {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 114px;
        height: 30px;
        border-radius: 0 0 18px 18px;
        background: #0a0a0a;
        z-index: 5;
        pointer-events: none;
      }

      .home-bar {
        position: absolute;
        bottom: 13px;
        left: 50%;
        transform: translateX(-50%);
        width: 132px;
        height: 5px;
        border-radius: 3px;
        background: rgba(28, 27, 25, 0.2);
        z-index: 5;
        pointer-events: none;
      }

      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 16px;
        background: rgba(18, 17, 14, 0.86);
        backdrop-filter: blur(14px);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }

      .bar button {
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: transparent;
        color: #b9b3a6;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .bar button:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #e9e4d8;
      }

      .bar button.on {
        background: #e9e4d8;
        border-color: transparent;
        color: #1c1b19;
      }

      .meta {
        margin-left: 6px;
        font-size: 11px;
        color: #6f6a5f;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

  <body>
    <div class="device" id="device">
      <div class="notch"></div>
      <iframe id="screen" src="/" title="工作台手机预览"></iframe>
      <div class="home-bar"></div>
    </div>

    <div class="bar">
      <button type="button" data-w="393" data-h="852" class="on">iPhone 15</button>
      <button type="button" data-w="375" data-h="667">iPhone SE</button>
      <button type="button" data-w="412" data-h="915">Pixel 7</button>
      <button type="button" id="reload">重新加载</button>
      <span class="meta" id="meta"></span>
    </div>

    <script>
      const screen = document.getElementById('screen')
      const device = document.getElementById('device')
      const meta = document.getElementById('meta')
      let current = { w: 393, h: 852 }

      /**
       * 应用尺寸。iframe 的宽度就是里面那个页面的视口宽度，
       * 所以 393px 时 Tailwind 的 md: 断点（768px）不会触发，手机布局自然生效。
       */
      function apply(w, h) {
        current = { w, h }
        screen.style.width = w + 'px'
        screen.style.height = h + 'px'
        meta.textContent = w + ' × ' + h
        fit()
      }

      /**
       * 窗口不够高时整体缩小，别让手机壳贴着窗口边和底部工具条。
       * 192 = 上留白 48 + 下留白 132 + 一点余量；宁可多缩几像素也不让边框贴边。
       */
      function fit() {
        const available = window.innerHeight - 220
        const full = current.h + 22
        const scale = Math.min(1, Math.max(0.55, available / full))
        device.style.transform = scale < 1 ? `scale(${scale})` : ''
      }

      document.querySelectorAll('[data-w]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-w]').forEach((b) => b.classList.remove('on'))
          btn.classList.add('on')
          apply(Number(btn.dataset.w), Number(btn.dataset.h))
        })
      })

      document.getElementById('reload').addEventListener('click', () => {
        // 加个时间戳绕开缓存，等于重新进来一次
        screen.src = '/?t=' + Date.now()
      })

      /**
       * iframe 里 env(safe-area-inset-*) 恒为 0——它不是真机，浏览器不知道自己有刘海。
       * 但应用读的是 var(--safe-top)/var(--safe-bottom)，同源下可以隔着 iframe 改掉，
       * 于是刘海和底部横条就真的会把内容推开，看到的就是手机上会发生的样子。
       */
      const SAFE_TOP = 44
      const SAFE_BOTTOM = 34

      function injectSafeArea() {
        try {
          const doc = screen.contentDocument
          if (!doc || !doc.head) return
          const style = doc.createElement('style')
          style.textContent =
            ':root{--safe-top:' + SAFE_TOP + 'px;--safe-bottom:' + SAFE_BOTTOM + 'px}'
          doc.head.appendChild(style)
        } catch {
          /* 跨源或者还没加载完，跳过就是了，不影响预览 */
        }
      }

      screen.addEventListener('load', injectSafeArea)
      injectSafeArea()

      window.addEventListener('resize', fit)
      apply(current.w, current.h)
    </script>
  </body>
</html>
